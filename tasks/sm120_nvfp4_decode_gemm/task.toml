# sm120_nvfp4_decode_gemm -- small-M (decode) NVFP4 block-scaled GEMM on the RTX PRO 5000 (sm_120a).
# Memory-bound: the packed e2m1 weight (+ its ue4m3 scales) dominates. cuBLASLt (torch._scaled_mm) reaches ~62 % of
# DRAM bandwidth at M <= 64; the weight (29 MB at 14336 x 4096) fits the 96 MB L2, so timing is L2-cold.

[task]
language = "cutedsl"
arch     = "sm120"

[reference]
run    = "reference/run.py:run"
source = "reference"

[target]
ratio = 1.3
l2    = "cold"

[budget]
hours    = 4
max_meta = 3
